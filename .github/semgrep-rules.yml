rules:
  - id: no-inner-html
    patterns:
      - pattern-either:
          - pattern: $X.innerHTML = $Y
          - pattern: $X.outerHTML = $Y
          - pattern: $X.insertAdjacentHTML(...)
          - pattern: document.write(...)
    message: Untrusted text must render via textContent, never as HTML.
    severity: ERROR
    languages: [typescript, javascript]
  - id: no-eval
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
    message: eval and new Function are forbidden.
    severity: ERROR
    languages: [typescript, javascript]
  - id: no-unsafe-url-fetch
    patterns:
      - pattern: fetch($URL)
      - pattern-not: fetch("...")
    message: Fetches must use fixed relative or allow-listed URLs, never user-built strings.
    severity: WARNING
    languages: [typescript, javascript]
